<body>
    <div class="login-container">
        <div class="card login-card shadow-lg">
            <div class="login-header">
                <img src="/images/BEDRCOK LOGO.JPG" alt="School Logo" class="login-logo">
                <h3>Create an Account</h3>
                <p>Join our digital community</p>
            </div>
            <div class="login-body">
                <div id="register-alert" class="text-center mb-3"></div>

                <form id="register-form">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fas fa-user text-secondary"></i></span>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fas fa-envelope text-secondary"></i></span>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">I am a...</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fas fa-user-tag text-secondary"></i></span>
                            <select name="role" class="form-select" required>
                                <option value="Parent">Parent</option>
                                <option value="Teacher">Teacher</option>
                                <option value="Student">Student</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fas fa-lock text-secondary"></i></span>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-login">Register</button>
                    </div>
                    <div class="login-footer">
                        <span class="text-secondary">Already have an account? <a href="portal_login.html">Login here</a></span>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- The script at the bottom of HTML/resister.html -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const registerForm = document.getElementById('register-form');
            const registerAlert = document.getElementById('register-alert');

            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                registerAlert.innerHTML = ''; // Clear previous messages

                const newUser = {
                    name: registerForm.elements.name.value,
                    email: registerForm.elements.email.value,
                    role: registerForm.elements.role.value,
                    password: registerForm.elements.password.value
                };

                try {
                    const response = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newUser)
                    });

                    if (response.status === 409) { // 409 Conflict (email exists)
                        const errorData = await response.json();
                        registerAlert.innerHTML = `<div class="alert alert-danger">${errorData.error}</div>`;
                        return;
                    }

                    if (!response.ok) {
                        throw new Error('Registration failed. Please try again.');
                    }

                    registerAlert.innerHTML = `<div class="alert alert-success">Registration successful! Please check your email to verify your account before logging in.</div>`;
                    setTimeout(() => { window.location.href = 'portal_login.html'; }, 3000);

                } catch (error) {
                    registerAlert.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
                }
            });
        });
    </script>






    <script src="/JS/pwa.js"></script>
</body>

</html>
